name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    # Fedora: GTK 4, libadwaita and VTE 3.91 as distro packages (PyGObject can't come from pip).
    container: fedora:43
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git python3 python3-gobject gobject-introspection gtk4 libadwaita vte291-gtk4 tmux
          xorg-x11-server-Xvfb dbus-daemon dbus-tools dejavu-sans-mono-fonts adwaita-icon-theme
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          Xvfb :99 -screen 0 1600x1000x24 &
          export DISPLAY=:99 GDK_BACKEND=x11 GSK_RENDERER=cairo
          dbus-run-session -- python3 -m unittest discover -s tests -t . -v
